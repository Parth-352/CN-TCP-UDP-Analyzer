# NetPulse experiment configuration

# server_ip: IP the CLIENT connects to (use 127.0.0.1 for single-device, or your LAN IP for two-device demo)
server_ip: "127.0.0.1"
# server_bind: IP the SERVER listens on (0.0.0.0 = accept from all interfaces, including LAN devices)
server_bind: "0.0.0.0"
server_port: 5001

# Packet sizes to test (in bytes)
packet_sizes:
  - 64
  - 256
  - 512
  - 1024

# Number of packets to send per experiment
num_packets: 100

# Timeout for waiting on UDP echo replies (seconds)
protocol_timeout_sec: 2
